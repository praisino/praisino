<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t">
<title id="t">Praise Taiwo, Founder of Alisops, Systems and Data Engineer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a1b27"/><stop offset="100%" stop-color="#24283b"/>
  </linearGradient>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#70a5fd" stop-opacity=".55"/><stop offset="100%" stop-color="#bf91f3" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdae" stop-opacity=".35"/><stop offset="100%" stop-color="#70a5fd" stop-opacity=".35"/>
  </linearGradient>
  <clipPath id="c"><rect width="1200" height="260" rx="14"/></clipPath>
</defs>
<style>
  .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
  .sub  { font: 600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #a9b1d6; letter-spacing: 2px; }
  .fade { opacity: 0; animation: fade 1s ease-out forwards; }
  .d2 { animation-delay: .35s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } animate { display: none; } }
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="260" fill="url(#bg)"/>
  <path fill="url(#w2)" d="M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1200 200 V260 H0 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1200 200 V260 H0 Z;
              M0 205 C 200 240, 400 165, 600 205 S 1000 240, 1200 205 V260 H0 Z;
              M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1200 200 V260 H0 Z"/>
  </path>
  <path fill="url(#w1)" d="M0 220 C 250 190, 450 250, 700 220 S 1050 195, 1200 225 V260 H0 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 220 C 250 190, 450 250, 700 220 S 1050 195, 1200 225 V260 H0 Z;
              M0 225 C 250 250, 450 195, 700 228 S 1050 250, 1200 218 V260 H0 Z;
              M0 220 C 250 190, 450 250, 700 220 S 1050 195, 1200 225 V260 H0 Z"/>
  </path>
  <text x="600" y="112" text-anchor="middle" class="name fade">Praise Taiwo</text>
  <text x="600" y="158" text-anchor="middle" class="sub fade d2">FOUNDER OF ALISOPS  •  SYSTEMS &amp; DATA ENGINEER</text>
</g>
</svg>
