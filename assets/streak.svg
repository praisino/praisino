<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-labelledby="t">
<title id="t">GitHub streak</title>
<style>
  .title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #70a5fd; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .muted { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #565f89; }
  .big   { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .fade  { opacity: 0; animation: fade .6s ease-in-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" rx="6" width="494" height="214" fill="#1a1b27" stroke="#2a2e48"/>
<text x="25" y="35" class="title">Contribution Streak</text>
<line x1="165" y1="60" x2="165" y2="185" stroke="#2a2e48"/>
<line x1="330" y1="60" x2="330" y2="185" stroke="#2a2e48"/>
<g class="fade" style="animation-delay:200ms"><text x="82" y="108" text-anchor="middle" class="big" style="fill:#a9b1d6">830</text><text x="82" y="140" text-anchor="middle" class="label" style="fill:#a9b1d6">Total Contributions</text><text x="82" y="162" text-anchor="middle" class="muted">Sep 7, 2019 - Present</text></g>
<circle cx="247" cy="105" r="38" fill="none" stroke="#70a5fd" stroke-width="5"/><path transform="translate(238,55) scale(1.1)" fill="#38bdae" d="M9 0c1 4 7 6 7 12a7 7 0 1 1-14 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 1-7 2-9z"/>
<g class="fade" style="animation-delay:350ms"><text x="247" y="113" text-anchor="middle" class="big" style="fill:#70a5fd">2</text><text x="247" y="168" text-anchor="middle" class="label" style="fill:#38bdae">Current Streak</text><text x="247" y="188" text-anchor="middle" class="muted">Nov 12 - Nov 13, 2026</text></g>
<g class="fade" style="animation-delay:500ms"><text x="412" y="108" text-anchor="middle" class="big" style="fill:#a9b1d6">7</text><text x="412" y="140" text-anchor="middle" class="label" style="fill:#a9b1d6">Longest Streak</text><text x="412" y="162" text-anchor="middle" class="muted">Oct 23 - Oct 29, 2024</text></g>
</svg>
