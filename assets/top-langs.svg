<svg xmlns="http://www.w3.org/2000/svg" width="350" height="215" viewBox="0 0 350 215" role="img" aria-labelledby="t">
<title id="t">Top languages</title>
<style>
  .title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #70a5fd; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .muted { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #565f89; }
  .big   { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .fade  { opacity: 0; animation: fade .6s ease-in-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" rx="6" width="349" height="214" fill="#1a1b27" stroke="#2a2e48"/>
<text x="25" y="35" class="title">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="52" width="300" height="8" rx="4"/></clipPath><g clip-path="url(#bar)">
<rect x="25.00" y="52" width="108.70" height="8" fill="#e34c26"/>
<rect x="133.20" y="52" width="90.11" height="8" fill="#3572A5"/>
<rect x="222.81" y="52" width="46.91" height="8" fill="#701516"/>
<rect x="269.23" y="52" width="29.19" height="8" fill="#f1e05a"/>
<rect x="297.91" y="52" width="14.30" height="8" fill="#663399"/>
<rect x="311.72" y="52" width="13.78" height="8" fill="#AA6746"/>
</g>
<g class="fade" style="animation-delay:150ms" transform="translate(25,88)"><circle cx="5" cy="-5" r="5" fill="#e34c26"/><text x="16" y="0" class="label">HTML</text><text x="140" y="0" text-anchor="end" class="muted">36.1%</text></g>
<g class="fade" style="animation-delay:230ms" transform="translate(180,88)"><circle cx="5" cy="-5" r="5" fill="#3572A5"/><text x="16" y="0" class="label">Python</text><text x="140" y="0" text-anchor="end" class="muted">29.9%</text></g>
<g class="fade" style="animation-delay:310ms" transform="translate(25,115)"><circle cx="5" cy="-5" r="5" fill="#701516"/><text x="16" y="0" class="label">Ruby</text><text x="140" y="0" text-anchor="end" class="muted">15.5%</text></g>
<g class="fade" style="animation-delay:390ms" transform="translate(180,115)"><circle cx="5" cy="-5" r="5" fill="#f1e05a"/><text x="16" y="0" class="label">JavaScript</text><text x="140" y="0" text-anchor="end" class="muted">9.6%</text></g>
<g class="fade" style="animation-delay:470ms" transform="translate(25,142)"><circle cx="5" cy="-5" r="5" fill="#663399"/><text x="16" y="0" class="label">CSS</text><text x="140" y="0" text-anchor="end" class="muted">4.6%</text></g>
<g class="fade" style="animation-delay:550ms" transform="translate(180,142)"><circle cx="5" cy="-5" r="5" fill="#AA6746"/><text x="16" y="0" class="label">Solidity</text><text x="140" y="0" text-anchor="end" class="muted">4.4%</text></g>
